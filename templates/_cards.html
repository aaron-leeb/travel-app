{% for name,image,price,description in destinations %}<article class="destination-card" data-name="{{ name }}" data-climate="{{ 'cold' if description.startswith('Cold') else 'warm' }}"><img src="/static/images/{{ image }}.{{ 'svg' if image == 'alpine' else 'jpg' }}" alt="{{ name }} destination" loading="lazy"><div class="card-body"><div class="card-heading"><h3>{{ name }}</h3><span>${{ price }}</span></div><p>{{ description }}</p><button class="text-button" data-detail="{{ name }}" data-price="{{ price }}">View trip →</button></div></article>{% endfor %}
